[pytest]
addopts = --durations=20 -m "not ignore"
markers =
    fast: tests that run quickly and use mocks/small fixtures
    integration: tests that test multiple components end-to-end
    ml: tests that run ML models and feature engineering
    reference: tests that use the full reference dataset
    no_detection_cache: opt out of the shared prepare_detection_data cache and run the uncached pipeline
