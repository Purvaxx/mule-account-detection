name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # The Reference Dataset lives one level above the repository root.
      - name: Fetch Reference Dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern dkdata.json --dir ..
          echo "586d7c6da422bcadcc127a4451e9df17b1c6ddc882bfb14c213a02ee6368093c  ../dkdata.json" | sha256sum -c -

      - name: Run tests
        run: python -m pytest -q
