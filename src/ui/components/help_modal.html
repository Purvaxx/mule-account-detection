<!--
    Explanatory help
    ================
    Served from HELP_DICT via /api/help.  Two shapes: a single contextual entry
    (text, optional interpretation, optional caution) and the structured global
    guide (sections).
-->
<div x-show="helpModalOpen" x-cloak
     class="fixed inset-0 z-[60] flex items-center justify-center p-4"
     role="dialog" aria-modal="true" aria-labelledby="help-title"
     @keydown.escape.window="helpModalOpen = false">
    <div class="absolute inset-0 bg-system-background/85 backdrop-blur-sm fade-in" @click="helpModalOpen = false"></div>
    <div class="relative glass border border-system-border-strong rounded-lg shadow-overlay max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden lift-in">
        <div class="px-6 py-4 border-b border-system-border flex items-center justify-between gap-4">
            <h3 id="help-title" class="text-sm font-bold text-system-heading uppercase tracking-[0.16em]" x-text="helpModalContent?.title"></h3>
            <button @click="helpModalOpen = false" class="text-system-muted hover:text-system-heading transition-colors rounded-sm" aria-label="Close">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="px-6 py-6 overflow-y-auto scroller space-y-5">
            <template x-if="helpModalContent?.text && !helpModalContent?.sections">
                <div class="space-y-4">
                    <p class="text-sm text-system-body leading-relaxed" x-text="helpModalContent.text"></p>
                    <template x-if="helpModalContent.interpretation">
                        <div class="well p-4">
                            <p class="eyebrow text-system-success">Interpretation</p>
                            <p class="text-[0.8125rem] text-system-body leading-relaxed mt-2" x-text="helpModalContent.interpretation"></p>
                        </div>
                    </template>
                    <template x-if="helpModalContent.caution">
                        <div class="border border-system-critical/40 bg-system-critical/10 rounded-sm p-4">
                            <p class="eyebrow text-system-critical">Caution</p>
                            <p class="text-[0.8125rem] text-system-body leading-relaxed mt-2" x-text="helpModalContent.caution"></p>
                        </div>
                    </template>
                </div>
            </template>
            <template x-if="helpModalContent?.sections">
                <div class="space-y-6">
                    <template x-for="section in helpModalContent.sections" :key="section.subtitle">
                        <div>
                            <h4 class="text-xs font-bold text-system-accent uppercase tracking-[0.16em] border-b border-system-border pb-2" x-text="section.subtitle"></h4>
                            <p class="text-[0.8125rem] text-system-body leading-relaxed mt-3" x-text="section.text"></p>
                        </div>
                    </template>
                </div>
            </template>
        </div>
        <div class="px-6 py-4 border-t border-system-border flex justify-end">
            <button @click="helpModalOpen = false" class="btn">Close</button>
        </div>
    </div>
</div>
